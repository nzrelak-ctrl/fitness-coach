<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0c0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Coach</title>
<style>
:root{
  --bg:#0b0c0d; --card:#1a1b1d; --card2:#242528; --card3:#2e2f33; --line:#2c2d31;
  --ink:#fff; --ink2:#a1a3a8; --muted:#6c6e74;
  --green:#34c84a; --green-soft:#8be08f; --green-ink:#062b0c; --green-dim:#1f3d24; --green-line:#1f5a2a; --green-rgb:52,200,74;
  --blue:#6cc7f6; --blue-ink:#06263a; --orange:#ff6b14; --red:#ee3b36; --yellow:#f3cf1a;
  --body:#2b2d30; --body-line:#0b0c0d;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-top:var(--safe-t);padding-bottom:calc(84px + var(--safe-b));min-height:100vh;overscroll-behavior-y:none}
main{max-width:560px;margin:0 auto;padding:10px 16px 24px}
button{font:inherit;color:inherit;background:var(--card2);border:0;border-radius:999px;padding:10px 16px;cursor:pointer}
button:active{transform:scale(.97);opacity:.85}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card2);border:1px solid transparent;border-radius:12px;padding:11px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green)}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:8px 0 14px}
.eyebrow{font-size:12.5px;letter-spacing:.06em;color:var(--ink2);text-transform:uppercase;font-weight:500}
h1{font-size:32px;line-height:1.05;margin:2px 0 0;font-weight:800;letter-spacing:-.02em;overflow-wrap:break-word}
.top>div:first-child{min-width:0;flex:1} .top>button,.top>.row{flex-shrink:0}
h2{font-size:19px;margin:0;font-weight:600}
h3{font-size:13px;margin:0;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.round{width:48px;height:48px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.round svg{width:22px;height:22px}
.card{background:var(--card);border-radius:24px;padding:18px;margin-bottom:12px}
.card.tight{padding:14px}
.sub{color:var(--ink2);font-size:14.5px}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1}
.green{color:var(--green)} .blue{color:var(--blue)} .orange{color:var(--orange)} .red{color:var(--red)} .yellow{color:var(--yellow)}
.btn-green{background:var(--green);color:var(--green-ink);font-weight:600}
.btn-blue{background:var(--blue);color:var(--blue-ink);font-weight:600}
.btn-red{background:var(--red);color:#fff;font-weight:600}
.btn-white{background:#fff;color:#000;font-weight:600}
.btn-ghost{background:transparent}
.btn-outline{background:transparent;border:2px solid var(--green)}
.block{display:block;width:100%;padding:16px;font-size:17px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border-radius:999px;padding:6px 12px;font-size:13.5px;color:var(--ink)}
.chip.on{background:var(--green);color:var(--green-ink);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.seg{display:flex;background:var(--card);border-radius:999px;padding:4px;margin-bottom:12px}
.seg button{flex:1;background:transparent;color:var(--ink2);font-size:17px;padding:10px}
.seg button.on{background:#fff;color:#000;font-weight:500}
/* stat tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tiles.three{grid-template-columns:repeat(3,1fr)}
.tile{background:var(--card2);border-radius:18px;padding:14px}
.tile .lbl{font-size:14px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.tile .val{font-size:22px;font-weight:700;margin-top:4px;letter-spacing:-.01em}
.tile .val small{font-size:15px;color:var(--ink2);font-weight:500}
/* week strip */
.week{display:flex;align-items:center;gap:4px}
.week .days{display:flex;flex:1;justify-content:space-between}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;padding:0;border-radius:0}
.day .c{width:42px;height:42px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--ink2);font-weight:500}
.day .d{font-size:14px;color:var(--ink2)}
.day.lift .c{background:var(--green-soft);color:var(--green-ink)}
.day.cardio .c{background:var(--blue);color:var(--blue-ink)}
.day.today .d{color:#fff;font-weight:700}
.day.rest .c{background:transparent;color:#c4b5fd;box-shadow:inset 0 0 0 2px #8b7bd8}
.heat i.r{background:#5b4f99}
.hab{background:var(--card);border-radius:22px;padding:14px 14px 12px;margin-bottom:10px}
.hab .ic{width:44px;height:44px;border-radius:14px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.hab .nm{font-weight:600;font-size:17px}
.hab .ctl{display:flex;align-items:center;gap:6px;flex-shrink:0}
.hab .ctl button{width:38px;height:38px;padding:0;font-size:20px}
.hab .ctl input{width:84px;text-align:center;padding:8px 6px}
.hchk{width:44px;height:44px;border-radius:50%;padding:0;font-size:20px;background:var(--card2);box-shadow:inset 0 0 0 2px var(--card3)}
.hchk.on{background:var(--green);color:var(--green-ink);box-shadow:none}
.hdots{display:flex;gap:5px;margin-top:10px}
.hdots i{flex:1;height:6px;border-radius:3px;background:var(--card3)}
.hdots i.p{background:var(--green-dim)} .hdots i.on{background:var(--green)}
.hgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.hgrid i{aspect-ratio:1;border-radius:5px;background:var(--card3)}
.hgrid i.p{background:var(--green-dim)} .hgrid i.on{background:var(--green)}
.day.sel .c{transform:scale(1.12);box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px #fff}
.day .dot{width:5px;height:5px;border-radius:50%;background:transparent;margin-top:-3px}
.day.today .dot{background:#fff}
.chev{background:none;padding:6px;color:var(--ink2);font-size:22px;line-height:1}
/* lists */
.li{padding:12px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .t{font-size:18px;font-weight:600}
.li .s{color:var(--ink2);font-size:15px;margin-top:2px}
.tap{cursor:pointer}
/* set cards (detail + logger) */
.excard{background:var(--card);border-radius:24px;padding:16px 12px 12px;margin-bottom:12px}
.excard .hd{display:flex;justify-content:space-between;align-items:center;padding:0 6px 10px}
.excard .hd b{font-size:18px;font-weight:600}
.set{background:var(--card2);border-radius:16px;padding:14px 16px;margin-top:8px;display:flex;align-items:center;gap:10px}
.set .n{flex:1;font-size:17px}
.set .sides{display:flex;flex-direction:column;gap:10px}
.set .v{display:flex;align-items:center;gap:10px;justify-content:flex-end;font-size:19px;font-weight:500}
.set .v small{font-size:15px;color:var(--ink2);font-weight:400;margin-left:1px}
.set .v .x{color:var(--muted);font-size:15px}
.side{width:28px;height:28px;border-radius:50%;background:var(--card3);display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink2);font-weight:600}
.drop{font-size:14px;color:var(--ink2);margin:4px 0 0 0;display:flex;justify-content:flex-end;gap:8px}
/* logger */
.lset{background:var(--card2);border-radius:16px;padding:10px 10px 10px 14px;margin-top:8px}
.lset.done{background:var(--green-dim)}
.lrow{display:flex;align-items:center;gap:8px}
.lrow+.lrow{margin-top:8px}
.lrow .n{width:52px;font-size:15px;color:var(--ink2)}
.lrow input{width:74px;text-align:center;padding:9px 4px;font-size:17px;background:var(--card3)}
.lrow .u{font-size:13px;color:var(--muted)}
.ck{width:44px;height:40px;border-radius:12px;padding:0;background:var(--card3);font-size:19px;margin-left:auto}
.lset.done .ck{background:var(--green);color:var(--green-ink)}
.feel{display:flex;gap:6px;margin-top:8px}
.feel button{flex:1;padding:7px 0;font-size:13px;background:var(--card3)}
.feel button.on{background:var(--green);color:var(--green-ink);font-weight:600}
.feel button.f-fail.on{background:var(--red);color:#fff}
.feel button.f-hard.on{background:var(--yellow);color:#2b2200}
.coachline{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--ink2);background:rgba(var(--green-rgb),.08);border-radius:12px;padding:9px 11px;margin:0 4px 4px}
.coachline .ic{color:var(--green)}
.coachline.live{background:rgba(108,199,246,.1)} .coachline.live .ic{color:var(--blue)}
/* floating action pair */
.fab{position:fixed;left:16px;right:16px;bottom:calc(92px + var(--safe-b));display:flex;gap:12px;z-index:8;max-width:528px;margin:0 auto}
.fab button{flex:1;padding:16px;font-size:18px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:rgba(11,12,13,.97);backdrop-filter:blur(10px);padding:8px 0 calc(6px + var(--safe-b))}
nav button{flex:1;background:none;border-radius:0;padding:4px 0;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:28px;height:28px}
nav button.on{color:#fff}
/* body diagram */
.bodywrap{position:relative}
.bodywrap svg{display:block;width:100%;height:auto}
[data-m]{cursor:pointer} [data-m]:hover{filter:brightness(1.25)} [data-m]:active{filter:brightness(1.5)}
.legend{display:flex;gap:14px;justify-content:center;font-size:13.5px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
/* bars */
.bars{display:flex;gap:4px;align-items:center}
.bars i{flex:1;height:26px;border-radius:6px;background:#26303a}
.bars i.on{background:var(--green)}
.bars i.dim{background:#1f3a24}
.bars i.peak{background:var(--blue)}
.lvl{display:flex;gap:5px;height:66px;align-items:stretch;margin-top:10px}
.lvl i{flex:1;border-radius:3px;background:#3a3c40}
.lvl i.on{background:var(--green)}
.meter{height:8px;border-radius:4px;background:var(--card3);overflow:hidden}
.meter>i{display:block;height:100%;border-radius:4px;background:var(--green)}
/* heatmap */
.heat{display:grid;grid-template-columns:repeat(13,1fr);gap:5px;margin-top:12px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--card3)}
.heat i.l{background:var(--orange)} .heat i.c{background:var(--blue)} .heat i.f{background:transparent}
/* rest timer */
#restbar{position:fixed;left:12px;right:12px;bottom:calc(88px + var(--safe-b));z-index:12;background:var(--card2);border-radius:20px;padding:10px 12px;display:none;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.6);max-width:536px;margin:0 auto}
#restbar.show{display:flex}
#restbar .t{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;min-width:66px}
#restbar .prog{flex:1;height:6px;background:var(--card3);border-radius:3px;overflow:hidden}
#restbar .prog i{display:block;height:100%;background:var(--green)}
#restbar button{padding:8px 11px;font-size:14px;background:var(--card3)}
/* sheet */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:30;display:flex;align-items:flex-end;animation:fade .15s}
.sheet{background:#151618;width:100%;max-width:560px;margin:0 auto;max-height:88vh;overflow:auto;border-radius:28px 28px 0 0;padding:10px 18px calc(22px + var(--safe-b))}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--card3);margin:0 auto 12px}
.sheet h2{font-size:22px;margin-bottom:12px}
@keyframes fade{from{opacity:0}}
label.f{display:block;margin-bottom:12px}
label.f span{display:block;font-size:13.5px;color:var(--ink2);margin:0 0 5px 4px}
.toast{position:fixed;left:50%;top:calc(12px + var(--safe-t));transform:translateX(-50%);background:var(--card2);border:1px solid var(--green);padding:10px 18px;border-radius:999px;z-index:40;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.5);white-space:nowrap}
/* charts */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.tt{position:absolute;pointer-events:none;background:var(--card3);border-radius:10px;padding:6px 9px;font-size:12.5px;white-space:nowrap;transform:translate(-50%,-115%);display:none;z-index:2}
.tt b{display:block;font-size:14px}
.empty{color:var(--muted);text-align:center;padding:26px 8px;font-size:15px}
/* gauge */
.gauge{position:relative;display:flex;justify-content:center;align-items:center}
.gauge .side{position:absolute;top:44%;background:var(--card);border-radius:18px;padding:10px 14px;text-align:center;width:auto;height:auto;display:block;color:var(--ink)}
.gauge .side b{display:block;font-size:22px}
.gauge .side span{font-size:14px;color:var(--ink2);font-weight:400}
.macro{background:var(--card);border-radius:14px;padding:10px 10px 0;overflow:hidden}
.macro .lbl{font-size:14px;color:var(--ink2)}
.macro .val{font-size:20px;font-weight:700;margin:2px 0 8px}
.macro .val small{color:var(--muted);font-weight:600}
.macro .meter{border-radius:0;margin:0 -10px;height:5px}
.pill-ch{position:fixed;left:14px;right:14px;bottom:calc(92px + var(--safe-b));z-index:7;background:#151617;border-radius:999px;padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 0 0 1px rgba(var(--green-rgb),.25),0 0 28px rgba(var(--green-rgb),.18);max-width:532px;margin:0 auto}
details>summary{list-style:none;cursor:pointer} details>summary::-webkit-details-marker{display:none}
.food{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--line)}
.food:first-child{border-top:0}
.clock{font-size:66px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.03em;margin:4px 0}
.phase{text-align:center;font-size:14px;text-transform:uppercase;letter-spacing:.12em;font-weight:700}
/* ===== Coach look (v7): rounded type, squarer controls, bordered cards, floating dock ===== */
html,body{font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button{border-radius:12px}
.chip{border-radius:9px}
.card,.excard,.hab{border-radius:18px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0)) ,var(--card)}
.tile{border-radius:14px}
.set,.lset{border-radius:12px}
h1{font-size:28px;font-weight:750;letter-spacing:-.01em}
.eyebrow{color:var(--green);text-transform:none;letter-spacing:0;font-weight:600;font-size:13.5px}
h3{letter-spacing:.02em;text-transform:none;font-size:14px;font-weight:600}
.round{border-radius:14px;width:44px;height:44px}
.block{border-radius:14px}
/* segmented control: underline tabs */
.seg{background:transparent;border-radius:0;padding:0;border-bottom:1px solid var(--line);gap:4px}
.seg button{border-radius:0;padding:10px 4px 12px;font-size:16px;position:relative}
.seg button.on{background:transparent!important;color:var(--ink)!important;font-weight:650}
.seg button.on::after{content:"";position:absolute;left:18%;right:18%;bottom:-1px;height:3px;border-radius:3px;background:var(--green)}
/* week strip: rounded tiles */
.week .days{gap:5px}
.day{flex:1;flex-direction:column-reverse;gap:1px;background:var(--card2);border-radius:12px;padding:7px 0 6px;max-width:48px;position:relative}
.day .c{width:auto;height:auto;background:none!important;box-shadow:none!important;transform:none!important;font-size:17px;font-weight:650;color:var(--ink)}
.day .d{font-size:11px;font-weight:600;letter-spacing:.04em}
.day .dot{position:absolute;bottom:-7px;left:50%;margin-left:-2.5px}
.day.lift{background:var(--green-soft)} .day.lift .c,.day.lift .d{color:var(--green-ink)}
.day.cardio{background:var(--blue)} .day.cardio .c,.day.cardio .d{color:var(--blue-ink)}
.day.rest{background:transparent;box-shadow:inset 0 0 0 2px #8b7bd8} .day.rest .c{color:#c4b5fd}
.day.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.day.full{background:var(--green)} .day.full .c,.day.full .d{color:var(--green-ink)}
.day.part{background:var(--green-dim)}
/* floating dock nav */
nav{left:12px;right:12px;bottom:calc(8px + var(--safe-b));padding:6px;border-radius:22px;background:rgba(26,27,29,.92);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.45);max-width:536px;margin:0 auto}
nav button{border-radius:16px;padding:7px 0 6px;font-size:11.5px;font-weight:600}
nav button svg{width:23px;height:23px}
nav button.on{background:rgba(var(--green-rgb),.16);color:var(--green)}
body{padding-bottom:calc(96px + var(--safe-b))}
#restbar{bottom:calc(86px + var(--safe-b));border-radius:16px;border:1px solid var(--line)}
.fab{bottom:calc(88px + var(--safe-b))}
.fab button{border-radius:14px}
.lvlbar{height:10px;border-radius:6px;background:var(--card3);overflow:hidden}
.lvlbar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--green),var(--green-soft))}
.hero{display:flex;gap:14px;align-items:center}
.avatar{width:68px;height:68px;border-radius:20px;background:linear-gradient(135deg,var(--green),var(--green-dim));display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:#fff;flex-shrink:0}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.statrow div{background:var(--card2);border-radius:12px;padding:10px;text-align:left}
.statrow b{display:block;font-size:17px} .statrow span{font-size:12px;color:var(--ink2)}
.hedit{width:34px;height:34px;padding:0;border-radius:10px;background:rgba(238,59,54,.15);color:var(--red);font-size:16px;flex-shrink:0}
#fs button{font-size:13.5px;padding:10px 2px 12px}
</style>
</head>
<body>
<main id="view"></main>

<div id="restbar">
  <div><div class="small muted" id="restlabel">Rest</div><div class="t" id="resttime">2:00</div></div>
  <div class="prog"><i id="restprog"></i></div>
  <button data-rest="-15">−15</button><button data-rest="15">+15</button><button data-rest="skip">Skip</button>
</div>

<nav id="nav">
  <button data-tab="profile"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="7.5" r="4.5"/><path d="M3.5 21c0-4.4 3.8-7.5 8.5-7.5s8.5 3.1 8.5 7.5z"/></svg>Profile</button>
  <button data-tab="workout"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.5 3.2c1.7-.6 3.5.3 4 2l.6 2.1c2.3-.6 4.9-.2 6.7 1.4 2.2 1.9 2.6 5.1 1 7.6-1.4 2.2-4 3.5-6.8 3.5H8.2c-2.6 0-4.7-2.1-4.7-4.7 0-1.5.7-2.9 1.9-3.8L6.3 6c.3-1.3 1.1-2.4 2.2-2.8z"/></svg>Workout</button>

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

const z2=n=>String(n).padStart(2,'0');
const dkey=(d=new Date())=>{ d=new Date(d); return `${d.getFullYear()}-${z2(d.getMonth()+1)}-${z2(d.getDate())}`; };
const parseKey=k=>{ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); };
const addDays=(d,n)=>{ const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const dayDiff=(a,b)=>Math.round((parseKey(dkey(b))-parseKey(dkey(a)))/864e5);
const sunday=d=>{ const x=parseKey(dkey(d)); x.setDate(x.getDate()-x.getDay()); return x; };
const DOW=['S','M','T','W','T','F','S'];
const fw=w=>{ if(w===''||w==null) return '—'; w=+w; return Number.isInteger(w)?String(w):w.toFixed(1).replace(/\.0$/,''); };
const big=n=>n>=1e6?(n/1e6).toFixed(1).replace(/\.0$/,'')+'m':n>=1e3?(n/1e3).toFixed(1).replace(/\.0$/,'')+'k':String(Math.round(n));
const dur=min=>{ min=Math.round(min); const d=Math.floor(min/1440), h=Math.floor(min%1440/60), m=min%60; return d?`${d}d ${h?h+'h':m+'m'}`:h?`${h}h ${m}m`:`${m}m`; };
const mmss=s=>{ s=Math.max(0,Math.round(s)); return `${Math.floor(s/60)}:${z2(s%60)}`; };
const uid=()=>Math.random().toString(36).slice(2,10);
const e1rm=(w,r)=>(!w||!r)?0:(r===1?w:w*(1+Math.min(r,15)/30));
const longDate=d=>new Date(d).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'}).toUpperCase();
function toast(m){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2300); }
function setVol(s,uni){ let v=(+s.w||0)*(+s.r||0); if(uni) v+=(+(s.wl??s.w)||0)*(+(s.rl??s.r)||0);
  for(const d of s.drops||[]) v+=(+d.w||0)*(+d.r||0)*(uni?2:1); return v; }
const exVol=e=>{ const u=exInfo(e.name).uni; return e.sets.filter(s=>s.done!==false).reduce((a,s)=>a+setVol(s,u),0); };
const wVol=w=>w.exercises.reduce((a,e)=>a+exVol(e),0);

const topSet=e=>e.sets.filter(s=>s.done!==false).reduce((b,s)=>(!b||+s.w>+b.w||(+s.w===+b.w&&+s.r>+b.r))?s:b,null);

/* activity per day */
function dayType(k){
  const lift = S.workouts.some(w=>dkey(w.date)===k) || S.imported.some(i=>i.date===k&&i.type==='lift');
  const cardio = S.cardio.some(c=>c.date===k) || S.imported.some(i=>i.date===k&&i.type==='cardio');
  return lift?'lift':cardio?'cardio':(S.restDays||[]).includes(k)?'rest':null;
}
function streak(asOf=new Date()){
  let n=0, d=parseKey(dkey(asOf)); if(!dayType(dkey(d))) d=addDays(d,-1);
  while(dayType(dkey(d))){ n++; d=addDays(d,-1); } return n;
}
function liftDaysBetween(a,b){ let n=0; for(let d=parseKey(dkey(a)); d<=b; d=addDays(d,1)) if(dayType(dkey(d))==='lift') n++; return n; }
function frequency(){
  const all=[...S.workouts.map(w=>dkey(w.date)),...S.imported.map(i=>i.date),...S.cardio.map(c=>c.date)].sort();
  if(!all.length) return 0;
  const first=parseKey(all[0]), from=addDays(new Date(),-55)>first?addDays(new Date(),-55):first;
  const span=dayDiff(from,new Date())+1;
  let n=0; for(let d=parseKey(dkey(from)); d<=new Date(); d=addDays(d,1)) if(dayType(dkey(d))) n++;
  // until 8 weeks of history exist here, blend in the frequency carried over from Arrow
  return (n + (S.carry.freq||0)*Math.max(0,56-span)/7) / (span>=56||!S.carry.freq ? span/7 : 8);
}

/* =====================================================================
   COACH — adaptive routine (pyramid-aware double progression)
   ===================================================================== */
function sessions(name, before=Infinity){
  return sortedW().filter(w=>new Date(w.date)<before).reverse()
    .map(w=>({w, e:w.exercises.find(e=>e.name===name)})).filter(x=>x.e && x.e.sets.some(s=>s.done!==false));
}
function plan(name, tmpl){
  const info=exInfo(name), [lo,hi]=tmpl?[tmpl.lo,tmpl.hi]:repRange(name), hist=sessions(name);
  if(!hist.length){ const n=tmpl?tmpl.sets:3;
    return { sets:[...Array(n)].map(()=>({w:'',r:''})), note:`New exercise — log what you do and I'll set your targets next time.`, kind:'new' }; }
  const last=hist[0].e.sets.filter(s=>s.done!==false), top=topSet(hist[0].e), W=+top.w, R=+top.r;
  const sets=last.map(s=>({w:+s.w, r:+s.r}));
  if(info.bw){
    const allHi=last.every(s=>s.r>=hi);
    return { sets:sets.map(s=>({w:s.w, r:allHi?s.r:Math.min(s.r+1,hi+5)})), kind:allHi?'up':'hold',
      note: allHi?`Every set hit ${hi}+ reps — add load (belt/vest) or slow the lowering to 3 s.`:`Bodyweight: beat last time by one rep per set (${last.map(s=>s.r).join(', ')}).` };
  }
  const topFeel=top.feel;
  if((R>=hi || (topFeel==='easy' && R>=lo)) && topFeel!=='fail'){
    const inc=incFor(W);
    return { sets:sets.map(s=>({w:s.w+incFor(s.w), r:Math.max(lo-2,s.r-2,1)})), kind:'up',
      note:`Top set was ${fw(W)} × ${R}${topFeel==='easy'?' and felt easy':''} — add weight: top set ${fw(W+inc)} lbs, aim ${Math.max(lo,R-2)}+ reps.` };
  }
  if(R<lo){
    const prev=hist[1]?topSet(hist[1].e):null;
    if(prev && +prev.w===W && +prev.r<lo)
      return { sets:sets.map(s=>({w:s.w>=W?round25(W*0.9):s.w, r:s.w>=W?lo:s.r})), kind:'down',
        note:`Top set under ${lo} reps two sessions running — reset it to ${fw(round25(W*0.9))} lbs and build back up.` };
    return { sets:sets.map(s=>({w:s.w, r:s.w>=W?lo:s.r})), kind:'hold', note:`Keep ${fw(W)} lbs on the top set and push for ${lo} reps (got ${R}).` };
  }
  return { sets:sets.map(s=>({w:s.w, r:Math.min(s.r+1, s.w>=W?hi:s.r+1)})), kind:'hold',
    note:`Same weights — add a rep per set. Top set ${fw(W)} × ${R} → aim ${R+1}. At ${hi} reps the weight goes up.` };
}
function nextRoutine(){
  if(!S.routines.length) return null;
  const last=[...sortedW()].reverse().find(w=>S.routines.some(r=>r.id===w.routine));
  if(!last) return S.routines[0];
  const i=S.routines.findIndex(r=>r.id===last.routine); return S.routines[(i+1)%S.routines.length];
}

/* PRs */
function bestBefore(name, before){ let b=0, bw=0;
  for(const {e} of sessions(name,before)) for(const s of e.sets){ if(s.done===false) continue; b=Math.max(b,e1rm(+s.w,+s.r)); bw=Math.max(bw,+s.w); }
  return {e1:b, w:bw}; }
function workoutPRs(w){
  const out=[];
  for(const e of w.exercises){ if(exInfo(e.name).bw) continue;
    const prev=bestBefore(e.name,new Date(w.date)); if(!prev.e1) continue;
    const top=e.sets.filter(s=>s.done!==false).reduce((b,s)=>e1rm(+s.w,+s.r)>e1rm(+b.w,+b.r)?s:b, e.sets[0]);
    if(e1rm(+top.w,+top.r)>prev.e1+0.01) out.push({name:e.name, w:+top.w, r:+top.r});
  } return out;
}

/* muscles */
function muscleSets(from, to=new Date(), primaryOnly=true){
  const m={}; Object.keys(MUSCLES).forEach(k=>m[k]=0);
  for(const w of S.workouts){ const d=new Date(w.date); if(d<from||d>to) continue;
    for(const e of w.exercises){ const n=e.sets.filter(s=>s.done!==false).length, i=exInfo(e.name);
      i.p.forEach(k=>m[k]+=n); if(!primaryOnly) i.s.forEach(k=>m[k]+=n*0.5); } }
  return m;
}
function recovery(now=Date.now()){
  const out={};
  for(const k of Object.keys(MUSCLES)){
    let last=null, load=0;
    for(const w of sortedW()){ for(const e of w.exercises){ const i=exInfo(e.name), n=e.sets.filter(s=>s.done!==false).length;
      const hit=i.p.includes(k)?n:i.s.includes(k)?n*0.5:0;
      if(hit){ if(!last||w.end>last){ last=w.end||+new Date(w.date); load=0; } if((w.end||+new Date(w.date))===last) load+=hit; } } }
    if(!last){ out[k]={ready:1, hours:null}; continue; }
    const hours=(now-last)/36e5, need=36+Math.min(load,14)*4;
    out[k]={ready:Math.max(0,Math.min(1,hours/need)), hours, need};
  }
  return out;
}

/* scores */
function scores(asOf=new Date()){
  const t=+asOf, dayMs=864e5;
  // strength: is each lift trained in the last 28 days trending up?
  const names=new Set(); S.workouts.forEach(w=>{ if(t-new Date(w.date)<28*dayMs && new Date(w.date)<=asOf) w.exercises.forEach(e=>names.add(e.name)); });
  let pts=0, n=0;
  for(const name of names){ if(exInfo(name).bw) continue;
    const hist=sessions(name, new Date(t+1)); if(hist.length<1) continue;
    const best=s=>Math.max(...s.e.sets.filter(x=>x.done!==false).map(x=>e1rm(+x.w,+x.r)));
    const recent=Math.max(...hist.filter(h=>t-new Date(h.w.date)<14*dayMs).map(best),0);
    const older=Math.max(...hist.filter(h=>t-new Date(h.w.date)>=14*dayMs).map(best),0);
    n++; pts += !older ? 0.8 : recent>older*1.005 ? 1 : recent>=older*0.97 ? 0.75 : 0.35; }
  const strength=Math.round(n? 50+50*pts/n : 50);
  const lifts=liftDaysBetween(addDays(asOf,-27),asOf);
  const consistency=Math.min(100,Math.round(lifts/(S.settings.weeklyTarget*4)*100));
  return { strength, consistency, total:Math.round(0.6*strength+0.4*consistency) };
}
function totals(){
  const v=S.workouts.reduce((a,w)=>a+wVol(w),0), m=S.workouts.reduce((a,w)=>a+wMin(w),0);
  const xp=S.carry.xp + S.workouts.reduce((a,w)=>a+100+2*wSets(w)+25*Math.min(4,w.prs||0),0) + S.cardio.length*40;
  return { workouts:S.carry.workouts+S.workouts.length, volume:S.carry.volume+v, minutes:S.carry.minutes+m+S.cardio.reduce((a,c)=>a+(+c.min||0),0),
           level:Math.floor(xp/400), pct:(xp%400)/400 };
}

function muscleSheet(k){
  const T=TARGET[k], wk=muscleSets(sunday(new Date()));
  const n=Math.round(wk[k]), x=n/T, zone=x>1?['Peak zone','var(--blue)']:x>=0.6?['Growth zone','var(--green)']:['Below growth','var(--yellow)'];
  const rec=recovery()[k], rp=Math.round(rec.ready*100), rcol=`hsl(${Math.round(rec.ready*120)} 70% 48%)`;
  const recTxt=rec.hours==null?'Not trained yet':rec.ready>=1?`Fully recovered · rested ${Math.max(1,Math.round(rec.hours/24))} day${Math.round(rec.hours/24)>1?'s':''}`:`Ready in about ${Math.ceil(rec.need-rec.hours)} h`;
  // last 6 weeks of main-focus sets
  const weeks=[...Array(6)].map((_,i)=>{ const from=addDays(sunday(new Date()),-7*(5-i)); return {from, n:Math.round(muscleSets(from,addDays(from,7))[k])}; });
  const wmax=Math.max(T,...weeks.map(w=>w.n));
  // exercises that worked it (90 days)
  const ex={}; let last=null, lastA=null;
  for(const w of sortedW()){ if(new Date(w.date)<addDays(new Date(),-90)) continue;
    for(const e of w.exercises){ const i=exInfo(e.name), role=i.p.includes(k)?'main':i.s.includes(k)?'assist':null; if(!role) continue;
      const r=ex[e.name]=ex[e.name]||{role,sets:0,best:null}; const done=e.sets.filter(s=>s.done!==false); r.sets+=done.length;
      for(const s of done) if(!r.best||e1rm(+s.w,+s.r)>e1rm(+r.best.w,+r.best.r)) r.best=s;
      if(role==='main') last={date:w.date,name:w.name}; else lastA={date:w.date,name:w.name}; } }
  last=last||lastA;
  const exList=Object.entries(ex).sort((a,b)=>(a[1].role===b[1].role?b[1].sets-a[1].sets:a[1].role==='main'?-1:1));
  const ideas=Object.keys({...LIB,...S.customEx}).filter(nm=>exInfo(nm).p.includes(k)&&!ex[nm]).slice(0,4);
  let tip;
  if(rec.ready<0.7) tip=`Still recovering — hold off on hard ${MUSCLES[k].toLowerCase()} work for ~${Math.ceil(rec.need-rec.hours)} h.`;
  else if(x<0.6) tip=`Add ${Math.ceil(T*0.6-n)} more sets this week to reach the growth zone${ideas.length||exList.length?` — try ${(exList.filter(e=>e[1].role==='main').map(e=>e[0])[0]||ideas[0])}`:''}.`;
  else if(x>1) tip=`Above target this week (${n}/${T}). More volume here won't add much — spend sets elsewhere.`;

    <div class="row" style="align-items:flex-end;gap:8px;height:90px">${weeks.map(w=>`<div style="flex:1;text-align:center">

    <h3 style="margin:18px 0 4px">Exercises · last 90 days</h3>
    ${exList.length?exList.map(([nm,r])=>`<div class="li"><div class="row between"><b style="font-weight:600">${esc(nm)}</b><span class="chip" style="font-size:12px;${r.role==='main'?'background:var(--green-dim);color:var(--green)':''}">${r.role==='main'?'Main':'Assists'}</span></div>

  const prev=sortedW().filter(x=>x.name===w.name && new Date(x.date)<new Date(w.date)).pop();
  const lines=[], vol=wVol(w);
  if(prev){ const pv=wVol(prev), d=(vol-pv)/pv*100;
    lines.push(`${d>=0?'📈':'📉'} Volume ${big(vol)} lbs — ${d>=0?'up':'down'} ${Math.abs(d).toFixed(0)}% vs your last ${esc(w.name)} (${new Date(prev.date).toLocaleDateString(undefined,{month:'short',day:'numeric'})}).`); }
  else lines.push(`📊 ${big(vol)} lbs moved across ${wSets(w)} sets in ${dur(wMin(w))}.`);
  const prs=workoutPRs(w); if(prs.length) lines.push(`🏆 ${prs.length} PR${prs.length>1?'s':''}: ${prs.map(p=>`${esc(p.name)} ${fw(p.w)}×${p.r}`).join(', ')}.`);
  // what slipped vs last time
  const slips=[], gains=[];
  for(const e of w.exercises){ const h=sessions(e.name,new Date(w.date))[0]; if(!h) continue;
    const a=topSet(e), b=topSet(h.e); const ea=e1rm(+a.w,+a.r), eb=e1rm(+b.w,+b.r);
    if(ea<eb*0.97) slips.push(e.name); else if(ea>eb*1.01) gains.push(e.name); }
  if(gains.length) lines.push(`💪 Stronger on ${gains.slice(0,3).map(esc).join(', ')}.`);
  if(slips.length) lines.push(`🎯 Focus next time: ${slips.slice(0,3).map(esc).join(', ')} — top set came in lighter than last session.`);
  // next session targets
  const ups=w.exercises.map(e=>({e, p:plan(e.name)})).filter(x=>x.p.kind==='up').slice(0,3);
  if(ups.length) lines.push(`⬆️ Ready to go heavier: ${ups.map(x=>`${esc(x.e.name)} → ${fw(Math.max(...x.p.sets.map(s=>s.w)))} lbs`).join(', ')}.`);
  return lines;
}

let tickIv=null;
function renderLogger(v){

    <div style="height:70px"></div>`;
  clearInterval(tickIv); tickIv=setInterval(()=>{ const el=$('#elapsed'); if(el && S.active) el.textContent=mmss((Date.now()-S.active.start)/1000); else clearInterval(tickIv); },1000);
  $('#aname').onblur=e=>{ A.name=e.target.textContent.trim()||A.name; save(); };
  const at=s=>s.split('.').map(Number);
  $$('[data-f]').forEach(i=>i.onchange=()=>{ const [a,b]=at(i.dataset.i), s=A.exercises[a].sets[b], k=i.dataset.f, val=i.value===''?'':+i.value;
    s[k]=val;
    if(k==='w'){ if(s.wl===undefined||s.wl===''||s._lsync!==false) { if('wl' in s) s.wl=val; }
      A.exercises[a].sets.slice(b+1).forEach(n=>{ if(!n.done && (n.w===''||n.w==null)){ n.w=val; if('wl' in n) n.wl=val; } }); }
    if(k==='r' && 'rl' in s && (s.rl===''||s._lsync!==false)) s.rl=val;
    if(k==='wl'||k==='rl') s._lsync=false;
    save(); render(); });
  $$('[data-done]').forEach(b=>b.onclick=()=>{ const [a,i]=at(b.dataset.done), e=A.exercises[a], s=e.sets[i];
    if(!s.done){ if(s.r===''||s.r==null) s.r=s.tr||0; if('rl' in s && (s.rl===''||s.rl==null)) s.rl=s.r; if(s.w===''||s.w==null) s.w=0; if('wl' in s && (s.wl===''||s.wl==null)) s.wl=s.w; }
    s.done=!s.done; if(!s.done) delete s.feel; save();
    if(s.done) startRest(S.settings.rest, `${e.name} · set ${i+1}`);
    render(); });
  $$('[data-feel]').forEach(b=>b.onclick=()=>{ const [a,i]=at(b.dataset.i); liveCoach(A.exercises[a], i, b.dataset.feel); save(); render(); });
  $$('[data-drop]').forEach(b=>b.onclick=()=>{ const [a,i]=at(b.dataset.drop), s=A.exercises[a].sets[i];
    const base=(s.drops&&s.drops.length)?+s.drops[s.drops.length-1].w:+s.w; (s.drops=s.drops||[]).push({w:round25(base*0.75),r:''}); save(); render(); });
  $$('[data-dw]').forEach(i=>i.onchange=()=>{ const [a,b,c]=at(i.dataset.dw); A.exercises[a].sets[b].drops[c][i.dataset.k]=i.value===''?'':+i.value; save(); });
  $$('[data-ddel]').forEach(b=>b.onclick=()=>{ const [a,s,c]=at(b.dataset.ddel); A.exercises[a].sets[s].drops.splice(c,1); save(); render(); });
  $$('[data-add]').forEach(b=>b.onclick=()=>{ const e=A.exercises[+b.dataset.add], l=e.sets[e.sets.length-1]||{w:''};

  $$('[data-mvex]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.mvex; if(i){ [A.exercises[i-1],A.exercises[i]]=[A.exercises[i],A.exercises[i-1]]; save(); render(); } });
  $('#addEx').onclick=()=>pickExercise(n=>{ A.exercises.push(newExercise(n,null)); save(); render(); });
  $('#timerB').onclick=timerSheet; $('#restT').onclick=restSheet;

  $('#finish').onclick=finishWorkout;
}
function loggerCard(e,ei){

      ${s.done?`<div class="feel">${['easy','good','hard','fail'].map(f=>`<button class="f-${f} ${s.feel===f?'on':''}" data-feel="${f}" data-i="${ei}.${i}">${{easy:'Easy',good:'Good',hard:'Hard',fail:'Failed'}[f]}</button>`).join('')}

/* Live Coach: adjust the next un-done set based on how this one felt */
function liveCoach(e, i, feel){
  const s=e.sets[i]; s.feel=feel; const n=e.sets.slice(i+1).find(x=>!x.done);
  const [lo,hi]=e.tmpl?[e.tmpl.lo,e.tmpl.hi]:repRange(e.name), w=+s.w||0, r=+s.r||0, inc=incFor(w), bw=exInfo(e.name).bw;
  const set=(x,nw,nr)=>{ if(!x) return; if(nw!=null){ x.w=nw; if('wl' in x) x.wl=nw; } if(nr!=null) x.tr=nr; };
  let msg;
  if(bw){ msg= feel==='easy'||feel==='good' ? `Next set: go for ${r+(feel==='easy'?2:0)} reps.` : `Next set: aim for ${Math.max(1,r-2)} clean reps.`; set(n,null,feel==='easy'?r+2:feel==='good'?r:Math.max(1,r-2)); }
  else if(feel==='easy'){ const base=n&&+n.w>w?+n.w:w, nw=base+incFor(base); set(n,nw,Math.max(lo,r-1)); msg=n?`Felt easy — next set ${fw(nw)} lbs × ${Math.max(lo,r-1)}.`:`Felt easy — add a set at ${fw(nw)} lbs, or go heavier next session.`; }
  else if(feel==='good'){ const nw=n&&+n.w>0?+n.w:w; set(n,nw,(+n?.w||w)>w?Math.max(lo,r-2):r); msg=n?`Right on target — next set ${fw(nw)} lbs × ${(+n.w||w)>w?Math.max(lo,r-2):r}.`:'Right on target — nice work.'; }
  else if(feel==='hard'){ const nw=n&&+n.w>w?w:(+n?.w||w); set(n,nw,Math.max(1,r-1)); msg=n?`Tough one — hold ${fw(nw)} lbs and aim for ${Math.max(1,r-1)} reps.`:'Tough one — rest a full 2–3 min before the next exercise.'; }
  else { const nw=round25(w*0.85); set(n,nw,lo); msg=n?`Missed it — drop to ${fw(nw)} lbs × ${lo} for the next set.`:`Missed the last rep — next session starts at this weight again.`; }
  e.live=msg;
}
function finishWorkout(){
  const A=S.active; if(!A.exercises.some(e=>e.sets.some(s=>s.done))){ if(confirm('No sets are checked off. Discard this workout?')){ S.active=null; save(); render(); } return; }
  const clean=A.exercises.map(e=>({name:e.name, sets:e.sets.filter(s=>s.done).map(s=>{ const o={w:+s.w||0,r:+s.r||0,done:true};
      if('wl' in s){ o.wl=+(s.wl===''?s.w:s.wl)||0; o.rl=+(s.rl===''?s.r:s.rl)||0; } if(s.feel) o.feel=s.feel; if(s.drops&&s.drops.length) o.drops=s.drops.filter(d=>d.r!=='').map(d=>({w:+d.w||0,r:+d.r||0})); return o; })})).filter(e=>e.sets.length);
  let w;
  if(A.editing){ w=S.workouts.find(x=>x.id===A.editing); Object.assign(w,{name:A.name, exercises:clean}); }
  else { w={id:A.id, name:A.name, routine:A.routine, start:A.start, end:Date.now(), date:new Date().toISOString(), exercises:clean}; S.workouts.push(w); }
  w.prs=workoutPRs(w).length; S.active=null; save(); stopRest();
  if(!A.editing) celebrate(w);
  selDay=dkey(w.date); go('workout',{detail:w.id});
}
function celebrate(w){

/* ---------- cardio ---------- */
const MET={Run:9.8,Walk:3.5,Bike:7.5,Swim:7,Elliptical:5,Stairmaster:9,Rowing:7,Hike:6,Basketball:6.5,Soccer:7,Tennis:7.3,Pickleball:5,Golf:4.8,HIIT:8,Yoga:3,Other:5};
const INTENSITY={easy:[0.8,'Easy'],moderate:[1,'Moderate'],hard:[1.25,'Hard']};
function bmr(){ const P=S.profile, lb=latestWeight()||P.bodyweight; if(!P.age||!P.heightIn||!P.sex||!lb) return null;
  return 10*lb*0.4536 + 6.25*P.heightIn*2.54 - 5*P.age + (P.sex==='m'?5:-161); }
/* Returns {cal, met, how} using: heart rate (Keytel) when given, else pace-based METs (ACSM) for run/walk/bike,
   else activity METs × intensity — scaled by your own resting metabolism (Mifflin-St Jeor) when age/height/sex are set. */
function cardioCalories(type, min, dist, intensity, hr){
  const P=S.profile, lb=latestWeight()||P.bodyweight, kg=lb*0.4536, h=min/60; if(!min) return {cal:0, how:''};
  if(hr && P.age && P.sex){
    const perMin = P.sex==='m' ? (-55.0969+0.6309*hr+0.1988*kg+0.2017*P.age)/4.184 : (-20.4022+0.4472*hr-0.1263*kg+0.074*P.age)/4.184;
    return {cal:Math.max(0,Math.round(perMin*min)), how:`Heart-rate formula (Keytel): avg ${hr} bpm · ${fw(lb)} lb · ${P.age} y · ${P.sex==='m'?'male':'female'}`};
  }
  let met=MET[type]*INTENSITY[intensity][0], paceTxt='';
  if(dist && min){ const mpm=dist*1609.34/min, mph=dist/h;
    if(type==='Run' && mpm>110){ met=(0.2*mpm+3.5)/3.5; paceTxt=`pace ${mmss(min*60/dist)}/mi`; }
    else if(type==='Walk'||type==='Hike'){ met=(0.1*Math.min(mpm,134)+3.5)/3.5*(type==='Hike'?1.5:1); paceTxt=`pace ${mmss(min*60/dist)}/mi`; }
    else if(type==='Bike'){ met=mph<10?4:mph<12?6.8:mph<14?8:mph<16?10:mph<20?12:15.8; paceTxt=`${mph.toFixed(1)} mph`; } }
  const B=bmr();
  const cal = B ? met*(B/24)*h : met*kg*h;
  return {cal:Math.round(cal), met, how:`${met.toFixed(1)} METs${paceTxt?` (${paceTxt})`:` · ${INTENSITY[intensity][1].toLowerCase()}`} × ${B?`your resting burn ${Math.round(B).toLocaleString()} cal/day (${fw(lb)} lb, ${Math.floor(P.heightIn/12)}'${P.heightIn%12}", ${P.age} y, ${P.sex==='m'?'male':'female'})`:`${fw(lb)} lb body weight`} × ${dur(min)}`};
}

  sheet(`<h2>Log cardio & activities</h2>

/* ---------- rest timer ---------- */
let rest={end:0,total:1,iv:null,beeped:false};
function startRest(sec,label){ clearInterval(rest.iv); rest={end:Date.now()+sec*1000,total:sec,iv:setInterval(tickRest,250),beeped:false};
  $('#restlabel').textContent=label||'Rest'; $('#restbar').classList.add('show'); tickRest(); unlockAudio(); }
function tickRest(){ const left=(rest.end-Date.now())/1000;
  $('#resttime').textContent=left>=0?mmss(left):'+'+mmss(-left); $('#restprog').style.width=Math.max(0,Math.min(100,(1-left/rest.total)*100))+'%';
  if(left<=0&&!rest.beeped){ rest.beeped=true; alertDone(); $('#restlabel').textContent='Rest over — next set'; } if(left<-90) stopRest(); }
function stopRest(){ clearInterval(rest.iv); rest.iv=null; $('#restbar').classList.remove('show'); }
$$('[data-rest]').forEach(b=>b.onclick=()=>{ const x=b.dataset.rest; if(x==='skip') return stopRest(); rest.end+=+x*1000; rest.total=Math.max(1,rest.total+ +x); if(rest.end>Date.now()) rest.beeped=false; tickRest(); });
let actx=null;
function unlockAudio(){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){} }
function beep(f=880,d=.15,w=0){ if(!actx) return; const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=f; o.connect(g); g.connect(actx.destination);
  const t=actx.currentTime+w; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.4,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.start(t); o.stop(t+d+.02); }
function alertDone(){ beep(880,.15,0); beep(880,.15,.25); beep(1320,.3,.5); navigator.vibrate&&navigator.vibrate([200,100,200,100,400]); }

/* ---------- interval timer ---------- */
let iv={running:false,phase:'ready',round:0,end:0,timer:null,work:40,rest:20,rounds:8,left:0};
function timerSheet(){
  const m=sheet(`<h2>Interval timer</h2><div class="phase" id="ivp">Ready</div><div class="clock" id="ivc">${mmss(iv.work)}</div><div class="sub" style="text-align:center;margin-bottom:12px" id="ivr">Round 1 of ${iv.rounds}</div>
    <div class="row"><label class="f grow"><span>Work (s)</span><input type="number" id="ivw" value="${iv.work}"></label><label class="f grow"><span>Rest (s)</span><input type="number" id="ivrest" value="${iv.rest}"></label><label class="f grow"><span>Rounds</span><input type="number" id="ivn" value="${iv.rounds}"></label></div>
    <div class="chips" style="margin-bottom:12px"><button class="chip" data-pre="20,10,8">Tabata 20/10×8</button><button class="chip" data-pre="40,20,10">40/20×10</button><button class="chip" data-pre="60,0,10">EMOM×10</button></div>
    <div class="row"><button class="grow btn-green block" id="ivgo">Start</button><button class="grow block" id="ivx">Reset</button></div>`, m=>{
    const read=()=>{ iv.work=Math.max(1,+m.querySelector('#ivw').value||40); iv.rest=Math.max(0,+m.querySelector('#ivrest').value||0); iv.rounds=Math.max(1,+m.querySelector('#ivn').value||1); };
    const paint=()=>{ const left=iv.running?(iv.end-Date.now())/1000:iv.phase==='paused'?iv.left:iv.work; if(!document.body.contains(m)) return;
      m.querySelector('#ivc').textContent=mmss(Math.ceil(Math.max(0,left))); const ph=iv.phase==='paused'?iv.pp:iv.phase;
      m.querySelector('#ivp').textContent=iv.phase==='paused'?'Paused':ph; m.querySelector('#ivp').style.color=ph==='work'?'var(--green)':ph==='rest'?'var(--blue)':'';
      m.querySelector('#ivr').textContent=`Round ${Math.max(1,iv.round)} of ${iv.rounds}`; m.querySelector('#ivgo').textContent=iv.running?'Pause':iv.phase==='paused'?'Resume':'Start'; };
    m.querySelectorAll('[data-pre]').forEach(b=>b.onclick=()=>{ const [w,r,n]=b.dataset.pre.split(',').map(Number); m.querySelector('#ivw').value=w; m.querySelector('#ivrest').value=r; m.querySelector('#ivn').value=n; read(); paint(); });
    m.querySelector('#ivgo').onclick=()=>{ unlockAudio();
      if(iv.running){ iv.running=false; iv.left=(iv.end-Date.now())/1000; iv.pp=iv.phase; iv.phase='paused'; clearInterval(iv.timer); paint(); return; }
      if(iv.phase==='paused'){ iv.phase=iv.pp; iv.end=Date.now()+iv.left*1000; } else { read(); iv.round=1; iv.phase='work'; iv.end=Date.now()+iv.work*1000; beep(660,.2); }
      iv.running=true; clearInterval(iv.timer); iv.timer=setInterval(()=>{ let left=(iv.end-Date.now())/1000;
        if(left<=3.05&&left>0&&Math.ceil(left)!==iv.lc){ iv.lc=Math.ceil(left); beep(520,.08); }
        if(left<=0){ if(iv.phase==='work'&&iv.rest>0&&iv.round<iv.rounds){ iv.phase='rest'; iv.end=Date.now()+iv.rest*1000; beep(440,.3); }
          else if(iv.round<iv.rounds){ iv.round++; iv.phase='work'; iv.end=Date.now()+iv.work*1000; beep(880,.3); }
          else { clearInterval(iv.timer); iv.running=false; iv.phase='done'; alertDone(); } }
        paint(); },200); paint(); };
    m.querySelector('#ivx').onclick=()=>{ clearInterval(iv.timer); Object.assign(iv,{running:false,phase:'ready',round:0}); read(); paint(); };
    paint();
  });
}

/* online search: USDA FoodData Central (branded + restaurant foods). Free key from api.data.gov raises the limit. */
async function fdcSearch(q){
  const key=S.settings.fdcKey||'DEMO_KEY';
  const url=`https://api.nal.usda.gov/fdc/v1/foods/search?api_key=${encodeURIComponent(key)}&pageSize=25&query=${encodeURIComponent(q)}&dataType=${encodeURIComponent('Branded,Survey (FNDDS),SR Legacy')}`;
  const r=await fetch(url); if(r.status===429) throw new Error('limit'); if(!r.ok) throw new Error('http');
  const d=await r.json();
  return (d.foods||[]).map(f=>{ const n=id=>{ const x=(f.foodNutrients||[]).find(z=>z.nutrientId===id); return x?x.value:0; };
    let kcal=n(1008)||n(2047)||n(2048); const per100={cal:kcal,p:n(1003),f:n(1004),c:n(1005)};
    const g=(f.servingSize&&/^(g|grm|ml|mlt)$/i.test(f.servingSizeUnit||''))?+f.servingSize:null;
    const brand=f.brandName||f.brandOwner||'';
    return { name:(brand?brand.replace(/\b\w/g,ch=>ch.toUpperCase()).replace(/\B\w+/g,w=>w.toLowerCase())+' · ':'')+f.description.toLowerCase().replace(/(^|[\s,(])\w/g,ch=>ch.toUpperCase()),
      per100, g, serv:f.householdServingFullText||'', cat:f.foodCategory||f.dataType };
  }).filter(f=>f.per100.cal>0);
}

/* Adaptive calorie targets: weekly check-in against the real weight trend */
function weightTrend(days=21){
  const pts=Object.entries(S.weights).map(([k,w])=>({x:dayDiff(new Date(),parseKey(k)),y:w})).filter(p=>p.x>=-days);
  if(pts.length<4 || (Math.max(...pts.map(p=>p.x))-Math.min(...pts.map(p=>p.x)))<7) return null;
  const n=pts.length, mx=pts.reduce((a,p)=>a+p.x,0)/n, my=pts.reduce((a,p)=>a+p.y,0)/n;
  const slope=pts.reduce((a,p)=>a+(p.x-mx)*(p.y-my),0)/pts.reduce((a,p)=>a+(p.x-mx)**2,0);
  return { perWeek:slope*7, avg:my, n };
}
function checkin(){
  const tr=weightTrend(), goal=S.profile.goal, bw=latestWeight()||S.profile.bodyweight;
  const want={gain:[0.0025,0.005], maintain:[-0.0025,0.0025], lose:[-0.01,-0.005]}[goal].map(x=>x*bw);
  if(!tr) return {ok:false, msg:'Log your weight at least 4 mornings across a week or more and I can tune your calories.'};
  let d=0; if(tr.perWeek<want[0]) d=+150; else if(tr.perWeek>want[1]) d=-150;
  const goalTxt={gain:'lean gain',maintain:'maintenance',lose:'fat loss'}[goal];
  return {ok:true, d, tr, msg: d===0?`You're ${tr.perWeek>=0?'gaining':'losing'} ${Math.abs(tr.perWeek).toFixed(2)} lbs/week — right in the ${goalTxt} range (${want[0].toFixed(1)} to ${want[1].toFixed(1)}). Keep ${S.nutrition.cal} calories.`
    : `You're ${tr.perWeek>=0?'gaining':'losing'} ${Math.abs(tr.perWeek).toFixed(2)} lbs/week; the ${goalTxt} target is ${want[0].toFixed(1)} to ${want[1].toFixed(1)}. ${d>0?'Add':'Cut'} ${Math.abs(d)} calories/day (mostly carbs).`};
}

function radar(grp){
  const keys=['Shoulders','Chest','Arms','Core','Legs','Back'], max=Math.max(1,...keys.map(k=>grp[k])), cx=170, cy=150, R=105;
  const pt=(i,f)=>{ const a=-Math.PI/2+i*Math.PI/3; return [cx+Math.cos(a)*R*f, cy+Math.sin(a)*R*f]; };
  const rings=[.2,.4,.6,.8,1].map(f=>`<polygon points="${keys.map((_,i)=>pt(i,f).join(',')).join(' ')}" fill="none" stroke="var(--green-line)" stroke-width="1"/>`).join('');
  const spokes=keys.map((_,i)=>`<line x1="${cx}" y1="${cy}" x2="${pt(i,1)[0]}" y2="${pt(i,1)[1]}" stroke="var(--green-line)"/>`).join('');
  const poly=keys.map((k,i)=>pt(i,Math.max(.06,grp[k]/max)).join(',')).join(' ');
  const labels=keys.map((k,i)=>{ const [x,y]=pt(i,1.2); return `<text x="${x}" y="${y+4}" text-anchor="middle" font-size="13" fill="var(--ink2)">${k}</text>`; }).join('');
  const dots=keys.map((k,i)=>{ const [x,y]=pt(i,Math.max(.06,grp[k]/max)); return `<circle cx="${x}" cy="${y}" r="4.5" fill="var(--green-soft)"><title>${k}: ${grp[k]} sets</title></circle>`; }).join('');
  return `<svg viewBox="0 0 340 300" style="width:100%;display:block;margin-top:6px"><defs><radialGradient id="rgf"><stop offset="0" style="stop-color:var(--green)" stop-opacity=".05"/><stop offset="1" style="stop-color:var(--green)" stop-opacity=".45"/></radialGradient></defs>
    ${rings}${spokes}<polygon points="${poly}" fill="url(#rgf)" stroke="var(--green)" stroke-width="2.5" stroke-linejoin="round"/>${dots}${labels}</svg>
    <div class="chips" style="justify-content:center;flex-wrap:wrap">${keys.map(k=>`<span class="chip" style="font-size:12.5px">${k} ${grp[k]}</span>`).join('')}</div>`;
}

/* ---------- line chart (single series, green area, hover tooltip) ---------- */
function lineChart(el, pts, {unit='', area=false}={}){
  if(pts.length<2){ el.innerHTML=`<div class="empty">${pts.length?'One more session and the trend line appears.':'No data yet.'}</div>`; return; }
  const W=340,H=200,L=8,R=8,T=12,B=22, xs=pts.map(p=>+p.x), ys=pts.map(p=>p.y);
  let y0=Math.min(...ys), y1=Math.max(...ys); const pad=(y1-y0)*.25||Math.max(1,y1*.05); y0-=pad; y1+=pad;
  const x0=Math.min(...xs), x1=Math.max(...xs);
  const X=v=>L+(x1===x0?0:(v-x0)/(x1-x0))*(W-L-R), Y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
  const d=pts.map((p,i)=>`${i?'L':'M'}${X(+p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join(' ');
  const grid=[.25,.5,.75].map(f=>`<line x1="${L}" x2="${W-R}" y1="${T+f*(H-T-B)}" y2="${T+f*(H-T-B)}" stroke="#2b2c2f" stroke-dasharray="4 5"/>`).join('');
  const fd=x=>new Date(x).toLocaleDateString(undefined,{month:'short',day:'numeric'});
  const lp=pts[pts.length-1];
  el.innerHTML=`<div class="chart"><svg viewBox="0 0 ${W} ${H}"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--green)" stop-opacity=".45"/><stop offset="1" style="stop-color:var(--green)" stop-opacity="0"/></linearGradient></defs>
    ${grid}<line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="#3a3b3f"/>
    ${area?`<path d="${d} L${X(x1)},${H-B} L${X(x0)},${H-B} Z" fill="url(#ga)"/>`:''}
    <path d="${d}" fill="none" stroke="var(--green)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(+lp.x)}" cy="${Y(lp.y)}" r="9" fill="var(--green)" fill-opacity=".3"/><circle cx="${X(+lp.x)}" cy="${Y(lp.y)}" r="5" fill="var(--green)"/>
    <text x="${L}" y="${H-5}" font-size="11" fill="var(--muted)">${fd(x0)}</text><text x="${W-R}" y="${H-5}" font-size="11" fill="var(--muted)" text-anchor="end">${fd(x1)}</text>
    <line class="xh" y1="${T}" y2="${H-B}" stroke="#fff" stroke-opacity=".5" stroke-dasharray="3 3" style="display:none"/><circle class="hd" r="5" fill="#fff" style="display:none"/>
    </svg><div class="tt"></div></div>`;
  const svg=el.querySelector('svg'), tt=el.querySelector('.tt'), xh=el.querySelector('.xh'), hd=el.querySelector('.hd');
  const mv=ev=>{ const r=svg.getBoundingClientRect(), mx=(ev.clientX-r.left)/r.width*W; let b=pts[0]; for(const p of pts) if(Math.abs(X(+p.x)-mx)<Math.abs(X(+b.x)-mx)) b=p;
    const px=X(+b.x), py=Y(b.y); xh.setAttribute('x1',px); xh.setAttribute('x2',px); xh.style.display=''; hd.setAttribute('cx',px); hd.setAttribute('cy',py); hd.style.display='';
    tt.innerHTML=`<b>${fw(Math.round(b.y*10)/10)} ${esc(unit)}</b>${esc(b.label||fd(b.x))}`; tt.style.display='block'; tt.style.left=(px/W*r.width)+'px'; tt.style.top=(py/H*r.height)+'px'; };
  svg.addEventListener('pointermove',mv); svg.addEventListener('pointerdown',mv); svg.addEventListener('pointerleave',()=>{ tt.style.display='none'; xh.style.display='none'; hd.style.display='none'; });
}

}

/* ---------- form tips sheet ---------- */
document.addEventListener('click',e=>{ const b=e.target.closest('[data-tips]'); if(!b) return; e.stopPropagation(); e.preventDefault(); tipsSheet(b.dataset.tips); },true);
function tipsSheet(name){
  const t=tipsFor(name), i=exInfo(name), generic=!TIPS[name];
  const sec=(title,icon,col,list)=>`<div class="card tight" style="background:var(--card);margin-bottom:10px"><div class="row" style="gap:8px;margin-bottom:6px"><span style="color:${col};font-size:17px">${icon}</span><b>${title}</b></div>
    ${list.map(x=>`<div class="row" style="align-items:flex-start;gap:8px;padding:4px 0;font-size:15px"><span style="color:${col}">•</span><span>${esc(x)}</span></div>`).join('')}</div>`;
  sheet(`<h2 style="margin-bottom:6px">${esc(name)}</h2>
    <div class="chips" style="flex-wrap:wrap;margin-bottom:12px">${i.p.map(k=>`<span class="chip on">${MUSCLES[k]}</span>`).join('')}${i.s.map(k=>`<span class="chip">${MUSCLES[k]}</span>`).join('')}${i.uni?'<span class="chip">One side at a time</span>':''}</div>
    ${generic?'<div class="sub small" style="margin-bottom:10px">General tips — this is a custom exercise. Add your own setup notes below.</div>':''}
    ${sec('Setup','⚙︎','var(--ink2)',t.s)}${sec('How to do it','▶︎','var(--green)',t.h)}${sec('Avoid injury','⚠︎','var(--yellow)',t.x)}${sec('Make it count','★','var(--blue)',t.e)}
    <label class="f"><span>My setup notes (seat, pin, cable height…)</span><textarea id="exn" rows="2" placeholder="e.g. Seat 4, back pad 3, cable notch 12">${esc(S.exNotes[name]||'')}</textarea></label>
    <button class="block btn-green" data-close>Done</button>`, m=>{
    m.querySelector('#exn').oninput=e=>{ const v=e.target.value.trim(); if(v) S.exNotes[name]=v; else delete S.exNotes[name]; save(); };
    m.addEventListener('click',e=>{ if((e.target===m||e.target.closest('[data-close]')) && tab==='workout' && S.active) render(); });
  });
}

/* ---------- color themes ---------- */
const ACCENTS={
  green:['#34c84a','#8be08f','#062b0c','#1f3d24','#1f5a2a','52,200,74'], blue:['#3b9eff','#9ccbff','#031a33','#172c45','#1d4370','59,158,255'],
  teal:['#22d3c5','#8ff0e8','#032c29','#143936','#1a5c56','34,211,197'], purple:['#a970ff','#d2b6ff','#1c0638','#2c2142','#4a2f7a','169,112,255'],
  pink:['#ff5fb0','#ffb3da','#3a0522','#401a2e','#7a2a55','255,95,176'], red:['#ff4d5e','#ffa3ac','#33030a','#40191e','#7a2430','255,77,94'],
  orange:['#ff8a1f','#ffc48a','#2e1500','#3d2a17','#6b3f12','255,138,31'], yellow:['#f5c518','#fae17a','#2e2400','#3a3317','#6b5a12','245,197,24']
};
const BGS={ black:['Black','#0b0c0d','#1a1b1d','#242528','#2e2f33','#2c2d31'], oled:['True black','#000000','#121213','#1c1c1e','#2a2a2d','#232325'],
  charcoal:['Charcoal','#17181b','#222327','#2c2d32','#37383d','#34353a'], navy:['Navy','#0a1020','#141c30','#1c263d','#26314b','#222c44'] };
function applyTheme(){
  const a=ACCENTS[S.settings.accent]||ACCENTS.green, b=BGS[S.settings.bg]||BGS.black, st=document.documentElement.style;
  [['--green',a[0]],['--green-soft',a[1]],['--green-ink',a[2]],['--green-dim',a[3]],['--green-line',a[4]],['--green-rgb',a[5]],
   ['--bg',b[1]],['--card',b[2]],['--card2',b[3]],['--card3',b[4]],['--line',b[5]]].forEach(([k,v])=>st.setProperty(k,v));
  document.querySelector('meta[name=theme-color]').setAttribute('content',b[1]);
}

/* =====================================================================
   BOOT
   ===================================================================== */
$$('#nav button').forEach(b=>b.onclick=()=>{ if(b.dataset.tab==='workout') selDay=selDay||dkey(); go(b.dataset.tab); });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&rest.iv) tickRest(); });
S.workouts.forEach(w=>{ if(w.prs==null||w.prs===0) w.prs=workoutPRs(w).length; });
if(S.active) tab='workout';
applyTheme();
render();
if('serviceWorker' in navigator && location.protocol!=='file:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
